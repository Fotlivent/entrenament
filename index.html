<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrenament">
<title>Entrenament matinal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Helvetica,sans-serif;background:#111;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 20px;text-align:center}
h1{font-size:22px;margin:6px 0 4px}
#info{font-size:16px;color:#aaa;min-height:20px}
#fase{font-size:30px;font-weight:800;margin:8px 0;min-height:38px}
#imgbox{width:100%;max-width:420px;aspect-ratio:4/3;background:#fff;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#imgbox img{width:100%;height:100%;object-fit:contain}
#temps{font-size:110px;font-weight:900;line-height:1;margin:10px 0;font-variant-numeric:tabular-nums}
#seg{font-size:18px;color:#ccc;min-height:24px;max-width:420px}
#barra{width:100%;max-width:420px;height:10px;background:#333;border-radius:5px;margin:10px 0;overflow:hidden}
#prog{height:100%;width:0;background:#2ecc71}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
button{font-size:20px;font-weight:700;padding:16px 22px;border:0;border-radius:14px;background:#2ecc71;color:#000}
button.sec{background:#444;color:#fff}
.treball #fase{color:#2ecc71}.repos #fase{color:#f39c12}
.avis{font-size:14px;color:#f39c12;max-width:420px;margin-top:12px}
</style>
</head>
<body>
<h1>Entrenament matinal</h1>
<div id="info">3 blocs × 4 minuts</div>
<div id="fase">Preparat?</div>
<div id="imgbox"><img id="img" alt=""></div>
<div id="temps">--</div>
<div id="seg"></div>
<div id="barra"><div id="prog"></div></div>
<div class="btns">
<button id="start">▶ COMENÇAR</button>
<button id="pausa" class="sec" style="display:none">⏸ Pausa</button>
<button id="salta" class="sec" style="display:none">⏭ Salta</button>
</div>
<p class="avis">🔊 Treu el mode silenci de l'iPhone (interruptor lateral) i puja el volum al màxim abans de començar.</p>
<script>
// Fotos: si poses imatges a la carpeta img/ amb aquests noms (planxa.jpg, flexions.jpg...), es mostren. Si no, surt el dibuix.
const C='stroke="#222" stroke-width="9" stroke-linecap="round" fill="none"';
const H=(x,y)=>`<circle cx="${x}" cy="${y}" r="14" fill="#222"/>`;
const G=`<line x1="10" y1="250" x2="390" y2="250" stroke="#bbb" stroke-width="4"/>`;
const svg=b=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#fff"/>${G}${b}</svg>`);
const EX={
 planxa:{nom:"Planxa",consell:"Cos recte, abdominals tensos",img:"img/planxa.jpg",svg:svg(`${H(90,180)}<path ${C} d="M105 188 L320 225 M320 225 L345 248 M120 192 L115 248 L160 248"/>`)},
 flexions:{nom:"Flexions",consell:"Pots fer-les amb genolls a terra",img:"img/flexions.jpg",svg:svg(`${H(95,150)}<path ${C} d="M110 160 L330 235 L350 248 M125 165 L125 248"/>`)},
 sentadilles:{nom:"Sentadilles",consell:"Talons a terra, esquena recta",img:"img/sentadilles.jpg",svg:svg(`${H(200,70)}<path ${C} d="M200 85 L190 160 L240 175 L225 248 M190 160 L230 250 M198 110 L270 115"/>`)},
 escaladors:{nom:"Escaladors",consell:"Porta els genolls al pit alternant",img:"img/escaladors.jpg",svg:svg(`${H(90,150)}<path ${C} d="M105 160 L260 195 L340 248 M260 195 L190 215 L200 248 M120 165 L120 248"/>`)},
 salt:{nom:"Salt en cuclilles",consell:"Aterra suau, genolls flexionats",img:"img/salt.jpg",svg:svg(`${H(200,45)}<path ${C} d="M200 60 L200 140 L180 190 L185 215 M200 140 L220 190 L215 215 M200 80 L160 30 M200 80 L240 30"/><path stroke="#2ecc71" stroke-width="5" fill="none" d="M150 235 L250 235"/>`)},
 rotacio:{nom:"Rotació de tronc amb goma",consell:"Gira el tronc, malucs quiets",img:"img/rotacio.jpg",svg:svg(`${H(200,70)}<path ${C} d="M200 85 L200 170 L175 248 M200 170 L225 248 M200 110 L300 120 M200 110 L300 130"/><path stroke="#e67e22" stroke-width="5" fill="none" d="M300 125 L385 125"/>`)}
};
const TREBALL=40,REPOS=20,REPOS_BLOC=60,RONDES=2;
const BLOCS=[["planxa","flexions"],["sentadilles","escaladors"],["salt","rotacio"]];
let passos=[{tipus:"repos",dur:10,ex:BLOCS[0][0],text:"Prepara't",info:"Comencem"}];
BLOCS.forEach((b,bi)=>{for(let r=0;r<RONDES;r++)b.forEach((e,ei)=>{
 passos.push({tipus:"treball",dur:TREBALL,ex:e,info:`Bloc ${bi+1} de 3 · Ronda ${r+1} de ${RONDES}`});
 const last=r==RONDES-1&&ei==1;
 if(last&&bi==BLOCS.length-1)return;
 const seg=last?BLOCS[bi+1][0]:b[(ei+1)%2];
 passos.push({tipus:"repos",dur:last?REPOS_BLOC:REPOS,ex:seg,text:last?"Descans entre blocs":"Descans",info:"Següent: "+EX[seg].nom});
});});
let ctx;
function beep(freq=880,dur=0.15,n=1){if(!ctx)return;for(let i=0;i<n;i++){const t=ctx.currentTime+i*(dur+0.08);const o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=freq;g.gain.setValueAtTime(1,t);g.gain.setValueAtTime(0,t+dur);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur);}if(navigator.vibrate)navigator.vibrate(200);}
let veu=null;
function triaVeu(){const v=speechSynthesis.getVoices();veu=v.find(x=>x.lang.startsWith("ca"))||v.find(x=>x.lang.startsWith("es"))||null;}
speechSynthesis.onvoiceschanged=triaVeu;triaVeu();
function diu(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(veu){u.voice=veu;u.lang=veu.lang}else u.lang="ca-ES";u.volume=1;u.rate=1.05;speechSynthesis.speak(u);}
let idx=0,rest=0,timer=null,pausat=false,wake=null;
const $=id=>document.getElementById(id);
function mostra(p){const e=EX[p.ex];document.body.className=p.tipus;$("fase").textContent=p.tipus=="treball"?e.nom:p.text;$("info").textContent=p.info;$("seg").textContent=p.tipus=="treball"?e.consell:"Següent: "+e.nom;const im=$("img");im.onerror=()=>{im.onerror=null;im.src=e.svg};im.src=e.img;im.style.opacity=p.tipus=="treball"?1:0.5;}
function inicia(i){idx=i;const p=passos[i];rest=p.dur;mostra(p);pinta();const e=EX[p.ex];
 if(p.tipus=="treball"){beep(1200,0.4);diu(`Comença. ${e.nom}. ${p.dur} segons.`);}
 else{beep(600,0.3,2);diu(i==0?`Prepara't. Comencem amb ${e.nom}`:`${p.text}. ${p.dur} segons. Després, ${e.nom}`);}}
function pinta(){$("temps").textContent=rest;$("prog").style.width=(100*(passos[idx].dur-rest)/passos[idx].dur)+"%";}
function tic(){if(pausat)return;rest--;pinta();
 if(rest<=0){if(idx+1<passos.length)inicia(idx+1);else fi();return;}
 if(rest<=5){beep(rest==1?1000:800,0.15);diu(String(rest));}
 else if(rest%10==0){beep(700,0.12);diu(`Queden ${rest} segons`);}}
function fi(){clearInterval(timer);timer=null;document.body.className="";$("fase").textContent="Fet! 💪";$("temps").textContent="✓";$("seg").textContent="";$("info").textContent="Entrenament completat";$("prog").style.width="100%";beep(1000,0.3,3);diu("Entrenament acabat. Molt bé!");$("start").style.display="";$("start").textContent="↻ TORNAR A COMENÇAR";$("pausa").style.display="none";$("salta").style.display="none";if(wake)wake.release().catch(()=>{});}
$("start").onclick=async()=>{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();diu(" ");try{wake=await navigator.wakeLock.request("screen")}catch(e){}
 $("start").style.display="none";$("pausa").style.display="";$("salta").style.display="";pausat=false;$("pausa").textContent="⏸ Pausa";inicia(0);clearInterval(timer);timer=setInterval(tic,1000);};
$("pausa").onclick=()=>{pausat=!pausat;$("pausa").textContent=pausat?"▶ Continua":"⏸ Pausa";diu(pausat?"Pausa":"Continuem");};
$("salta").onclick=()=>{if(idx+1<passos.length)inicia(idx+1);else fi();};
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState=="visible"&&timer){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}});
mostra(passos[1]);
</script>
</body>
</html>
